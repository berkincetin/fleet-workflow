[project]
name = "fleet-mcp"
version = "0.1.0"
description = "Fleet MCP servers"
requires-python = ">=3.12"
dependencies = [
    "fleet-rag",
    "asyncpg>=0.29",
    "aiosmtplib>=3.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleet_mcp"]

[tool.uv.sources]
fleet-rag = { workspace = true }
