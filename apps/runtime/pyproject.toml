[project]
name = "fleet-runtime"
version = "0.1.0"
description = "Fleet LangGraph runtime — governed agents, LLM gateway client, guardrails."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "opentelemetry-api>=1.28",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "redis>=5.3.1",
    "psycopg[binary]>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
