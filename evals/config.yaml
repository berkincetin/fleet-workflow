# Per-agent eval thresholds (TRD §13.4). `make eval AGENT=x` fails (exit 1)
# if the agent's pass rate is below its threshold; CI blocks agent-affecting
# PRs the same way.
agents:
  support_copilot:
    dataset: datasets/support_copilot.jsonl
    threshold: 0.90
  analytics:
    dataset: datasets/analytics.jsonl
    threshold: 0.90
  dev_agent:
    dataset: datasets/dev_agent.jsonl
    threshold: 0.90
  invoice_agent:
    dataset: datasets/invoice_agent.jsonl
    threshold: 0.90
  hr_agent:
    dataset: datasets/hr_agent.jsonl
    threshold: 0.90
  listing_quality:
    dataset: datasets/listing_quality.jsonl
    # 0.85 not 0.90: this is a vision agent judging rendered listing photos; the
    # dept scenario's own bar is "false-positive control >= 85% precision".
    threshold: 0.85
  vehicle_intake:
    dataset: datasets/vehicle_intake.jsonl
    # 0.85: extraction runs on local tesseract OCR of rendered reports, so some
    # OCR-level noise on long VINs is expected; the guardrails (missing→incomplete,
    # band-contains-median, redaction) are the hard asserts.
    threshold: 0.85
  dealer_onboarding:
    dataset: datasets/dealer_onboarding.jsonl
    # 0.85, same rationale as vehicle_intake plus one more: extraction runs on
    # local tesseract OCR *and* the local 7B (the pii lane admits no cloud
    # model), so long digit strings (10-digit tax numbers, 26-char IBANs) carry
    # OCR-level noise. The hard asserts are the guardrails — mismatch → flag with
    # no email, missing docs → approval-gated email that names exactly the right
    # items, nothing sent or moved before approval.
    threshold: 0.85
  legal_review:
    dataset: datasets/legal_review.jsonl
    # 0.85: clause extraction runs on the local 14B-class lane (contracts are
    # confidential and never leave the machine), which is less consistent than
    # the cloud reasoning models the 0.90 agents use. Recall of the planted
    # clause and the citation-resolution guardrail are the hard asserts —
    # schema and playbook_ref validity are checked on every case, not only the
    # "schema" ones.
    threshold: 0.85
  insights_publisher:
    dataset: datasets/insights_publisher.jsonl
    # 0.90: numbers-match + no-invent are deterministic hard checks; brand-voice
    # is a utility-model rubric judge (>= 4/5). The drafter is told to use only
    # the provided numbers, so grounding should be near-perfect.
    threshold: 0.90
