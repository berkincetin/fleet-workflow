# Per-agent eval thresholds (TRD §13.4). `make eval AGENT=x` fails (exit 1)
# if the agent's pass rate is below its threshold; CI blocks agent-affecting
# PRs the same way.
agents:
  support_copilot:
    dataset: datasets/support_copilot.jsonl
    threshold: 0.90
  analytics:
    dataset: datasets/analytics.jsonl
    threshold: 0.90
  dev_agent:
    dataset: datasets/dev_agent.jsonl
    threshold: 0.90
  invoice_agent:
    dataset: datasets/invoice_agent.jsonl
    threshold: 0.90
  hr_agent:
    dataset: datasets/hr_agent.jsonl
    threshold: 0.90
  listing_quality:
    dataset: datasets/listing_quality.jsonl
    # 0.85 not 0.90: this is a vision agent judging rendered listing photos; the
    # dept scenario's own bar is "false-positive control >= 85% precision".
    threshold: 0.85
