name: fleet-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fleet}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fleet_dev_pw}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports: ["8080:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.53.7-stable
    ports: ["4000:4000"]
    # Boot from the pinned model matrix (gateway/litellm/config.yaml, TRD §4.2).
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ../../gateway/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-fleet-dev-master}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Langfuse callback (TRD §6). Defaults match the langfuse service's
      # headless-init keys below so tracing works out of the box; override in
      # .env to point at a real project.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-fleet-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-fleet-dev}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    depends_on:
      langfuse:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleet_dev_pw}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme_dev_secret}
      SALT: ${LANGFUSE_SALT:-changeme_dev_salt}
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap (Langfuse v2): create an org/project/user + a fixed
      # API keypair on first boot so the LiteLLM proxy can emit traces without a
      # manual UI step. Dev-only credentials.
      LANGFUSE_INIT_ORG_ID: fleet
      LANGFUSE_INIT_PROJECT_ID: fleet-dev
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-fleet-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-fleet-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@fleet.dev}
      LANGFUSE_INIT_USER_NAME: Fleet Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-fleet_dev_pw}
    ports: ["3001:3000"]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3002:3000"]
    depends_on: [prometheus, loki]

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    ports: ["3100:3100"]

  # Alertmanager has no native ${VAR} expansion for its config file (verified
  # against the real v0.28.0 binary, task 7.4) and refuses to start on a
  # truly empty api_url ("unsupported scheme for URL"), so the mounted file
  # is a template with a __SLACK_WEBHOOK_URL__ token, substituted at startup
  # via sed into a real config with either FLEET_SLACK_WEBHOOK_URL or a
  # syntactically-valid-but-inert placeholder (never blocks `make dev`).
  alertmanager:
    image: prom/alertmanager:v0.28.0
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
    environment:
      FLEET_SLACK_WEBHOOK_URL: ${FLEET_SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/PLACEHOLDER}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sed "s#__SLACK_WEBHOOK_URL__#$$FLEET_SLACK_WEBHOOK_URL#" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml &&
        exec alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports: ["9093:9093"]

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["1025:1025", "8025:8025"]

  # n8n queue mode (task 6.1, TRD §3/§15): main handles the editor UI/API and
  # enqueues executions; worker(s) pull from the same Redis queue and actually
  # run workflows — this is what "scales to hundreds of automations" means in
  # practice (adding workers scales throughput without touching main). Redis
  # DB 2 keeps the queue isolated from rate-limiting (DB 0) and RAG ingestion
  # (DB 1). Human editor access goes through n8n-oauth2-proxy (:5679) only;
  # the loopback-only port below (task 6.5.4) is for the Fleet API's own
  # workflows router (REST API + webhook triggers) to reach n8n directly from
  # the host, without going through the SSO gate meant for humans.
  n8n-main:
    image: n8nio/n8n:1.71.3
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_DB: "2"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-fleet}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-fleet_dev_pw}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-fleet_dev_n8n_encryption_key}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5679/
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      GENERIC_TIMEZONE: Europe/Istanbul
      # Automations' `$env.*` references (task 6.1/6.2/6.3 workflows) — the
      # Fleet API key is a per-workflow service credential, not a secret n8n
      # needs to protect from its own users (same trust level as the DB
      # password above), so a plain env var is fine for dev; a real
      # deployment would use n8n's credential store instead.
      FLEET_API_BASE_URL: ${FLEET_API_BASE_URL_FOR_N8N:-http://host.docker.internal:8000}
      FLEET_API_KEY: ${N8N_FLEET_API_KEY:-}
    ports:
      # Loopback-only: reachable from the Fleet API (running on the host in
      # dev) via http://localhost:5678, never from the LAN. Humans still go
      # through n8n-oauth2-proxy at :5679 only.
      - "127.0.0.1:5678:5678"
    volumes:
      - ../../workflows:/import/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n-worker:
    image: n8nio/n8n:1.71.3
    command: ["worker"]
    environment:
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_DB: "2"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-fleet}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-fleet_dev_pw}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-fleet_dev_n8n_encryption_key}
      GENERIC_TIMEZONE: Europe/Istanbul
      # Executions run on the worker in queue mode, not main — see n8n-main's
      # FLEET_API_BASE_URL/FLEET_API_KEY comment above for why these exist.
      FLEET_API_BASE_URL: ${FLEET_API_BASE_URL_FOR_N8N:-http://host.docker.internal:8000}
      FLEET_API_KEY: ${N8N_FLEET_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-main:
        condition: service_started

  # SSO gate in front of n8n (TRD §3/§15: n8n's fair-code license forbids
  # white-label embedding, so it must live on its own reachable surface,
  # gated by Keycloak rather than folded into Fleet's own auth). A real OIDC
  # authorization-code flow against the same `fleet` realm every other
  # component uses; unauthenticated requests get redirected to Keycloak
  # login, never proxied through to n8n-main. Local dev stands in for
  # "own subdomain" with a dedicated port, since compose has no DNS.
  n8n-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      # Keycloak stamps the ID token's `iss` claim from the base URL the
      # browser actually used (localhost:8080), not from any server-side
      # setting — so oidc-issuer-url (the value oauth2-proxy validates `iss`
      # against) must match that, even though it also reaches Keycloak over
      # the compose network for the token/JWKS calls below. OIDC
      # auto-discovery (the default) would instead resolve login/redeem/jwks
      # from Keycloak's own internal metadata (keycloak:8080), which the
      # browser can't reach — skip it and supply each endpoint explicitly.
      - --oidc-issuer-url=http://localhost:8080/realms/fleet
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:8080/realms/fleet/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/fleet/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/fleet/protocol/openid-connect/certs
      - --client-id=n8n
      - --client-secret=n8n-oauth2-proxy-dev-secret
      - --redirect-url=http://localhost:5679/oauth2/callback
      - --upstream=http://n8n-main:5678
      - --email-domain=*
      - --skip-provider-button=true
      # Dev-realm seed users (fleet-realm.json) aren't marked emailVerified —
      # a demo-data gap, not a real KVKK/production concern (this repo's own
      # Keycloak, no external federation) — so oauth2-proxy's default
      # verified-email requirement would reject every seeded user.
      - --insecure-oidc-allow-unverified-email=true
      - --cookie-secret=${N8N_PROXY_COOKIE_SECRET:-fleet_dev_cookie_secretx}
      - --cookie-secure=false
      - --ssl-insecure-skip-verify=true
    ports: ["5679:4180"]
    depends_on:
      keycloak:
        condition: service_started
      n8n-main:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
  miniodata:
