global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Fleet API runs on the host (`make api`, uvicorn --reload on :8000),
  # not as a compose service (see Makefile) — host.docker.internal is
  # Docker Desktop's route from inside the compose network back to the host.
  - job_name: fleet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
