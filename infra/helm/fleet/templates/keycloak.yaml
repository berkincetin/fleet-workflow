apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ include "fleet.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          command:
            - /opt/keycloak/bin/kc.sh
            - start-dev
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.keycloak.adminUser | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword | quote }}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ include "fleet.namespace" . }}
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
