apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ include "fleet.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
          ports:
            - containerPort: 9000
            - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ include "fleet.namespace" . }}
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
{{- if .Values.minio.buckets }}
---
{{- /* Create the buckets and turn on versioning (TRD §14). Runs as a post-install
hook so MinIO is up; idempotent (`mb -p` / repeated version-enable are no-ops). */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: {{ include "fleet.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.qdrant.snapshot.mcImage | default "minio/mc:latest" }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 3
              done
              {{- range .Values.minio.buckets }}
              mc mb -p local/{{ . }} || true
              {{- if $.Values.minio.versioning }}
              mc version enable local/{{ . }}
              {{- end }}
              {{- end }}
              echo "minio buckets ready"
{{- end }}
