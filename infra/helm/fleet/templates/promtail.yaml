{{/*
Promtail — the log shipper feeding Loki (task 13.3).

Loki has been in the chart since task 1.5 with no input; this is what actually
puts pod logs into it (TRD §6). A DaemonSet rather than a Deployment because
container logs live on each node's filesystem, so a shipper has to run on every
node. Unlike the compose stack — which discovers containers over the Docker API
because Docker Desktop hides the log directory from the host — in Kubernetes the
node's /var/log is directly mountable, so this uses the standard
kubernetes_sd_configs + hostPath arrangement, and it therefore also picks up the
Fleet API's own logs, which the dev compose shipper cannot.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: {{ include "fleet.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fleet.namespace" . }}-promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fleet.namespace" . }}-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fleet.namespace" . }}-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: {{ include "fleet.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ include "fleet.namespace" . }}
data:
  promtail-config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: {{ include "fleet.namespace" . }}
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: job
            replacement: {{ include "fleet.namespace" . }}
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ include "fleet.namespace" . }}
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: {{ .Values.promtail.image }}
          args: ["-config.file=/etc/promtail/promtail-config.yml"]
          ports:
            - containerPort: 9080
          resources:
            {{- toYaml .Values.promtail.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: positions
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
