[project]
name = "fleet"
version = "0.1.0"
description = "Fleet — internal AI operations platform (monorepo root)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
# apps/web is a Next.js (pnpm) package, not a Python member — list the Python apps explicitly
# so the apps/* glob does not pull apps/web into the uv workspace.
members = ["apps/api", "apps/runtime", "apps/rag", "apps/mcp", "packages/*"]
exclude = ["apps/web"]

[tool.uv]
# dev dependencies shared across the workspace
dev-dependencies = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
